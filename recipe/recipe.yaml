schema_version: 1

context:
  name: xrootd
  version: "6.0.3"

recipe:
  name: xrootd-split
  version: ${{ version }}

source:
  url: https://github.com/xrootd/xrootd/archive/v${{ version }}.tar.gz
  sha256: 431db0f59ee4048f27718cd8fc8f1ab49247a177f59d30dc7525913693c3f163
  patches:
    - patches/0001-Python-Fix-standalone-build-against-an-installed-XRo.patch

build:
  number: 0
  skip: win

outputs:
  # Build the C++ core once per job with the Python bindings disabled. The
  # bindings are built separately (see the "xrootd" output below) against the
  # installed libraries, which avoids find_package(Python) running in the
  # cross-compiled main build (CMake >= 4.1, policy CMP0190).
  - staging:
      name: xrootd-build
    build:
      script:
        file: build_core.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - cmake
        - make
        - pkg-config
      host:
        - openssl
        - readline
        - libxml2-devel
        - if: not osx
          then: libuuid
        - libcurl
        - krb5
        - zlib
        - ncurses
        - scitokens-cpp
        - libxcrypt

  - package:
      name: libxrootd
    inherit: xrootd-build
    build:
      files:
        # versioned shared libraries (linux / macOS)
        - lib/libXrd*.so.*
        - lib/libXrd*.*.dylib
        # runtime-loaded plugins (named libXrd<Name>-<major>.so on both platforms)
        - lib/libXrd*-*.so
    requirements:
      run_exports:
        - ${{ pin_subpackage('libxrootd', upper_bound='x') }}
    tests:
      - package_contents:
          strict: true
          lib:
            # key client library, plus all other shared libraries
            - XrdCl
            - Xrd*
          files:
            # runtime-loaded plugins use a .so suffix on both Linux and macOS
            - lib/libXrd*-*.so
    about:
      summary: XRootD shared libraries and plugins

  - package:
      name: libxrootd-devel
    inherit:
      from: xrootd-build
      run_exports: false
    build:
      files:
        include:
          - include/xrootd/**
          - lib/cmake/**
          - bin/xrootd-config
          # unversioned development symlinks
          - lib/libXrd*.so
          - lib/libXrd*.dylib
        exclude:
          # plugins and versioned libraries belong to libxrootd
          - lib/libXrd*-*.so
          - lib/libXrd*.*.dylib
    requirements:
      run:
        - ${{ pin_subpackage('libxrootd', exact=True) }}
    tests:
      - package_contents:
          strict: true
          include:
            - xrootd/XrdVersion.hh
            - xrootd/**
          bin:
            - xrootd-config
          # unversioned development symlinks (lib matches .so / .dylib)
          lib:
            - XrdCl
            - Xrd*
          files:
            exists:
              - lib/cmake/XRootD/XRootDConfig.cmake
              - lib/cmake/XRootD/*.cmake
            not_exists:
              # plugins and versioned libraries belong to libxrootd
              - lib/libXrd*-*.so
              - lib/libXrd*.so.*
              - lib/libXrd*.*.dylib
    about:
      summary: Development files (headers, CMake config) for XRootD

  - package:
      name: xrootd-cli
    inherit: xrootd-build
    build:
      files:
        include:
          - bin/**
          - share/**
        exclude:
          - bin/xrootd-config
    requirements:
      run:
        - ${{ pin_subpackage('libxrootd', upper_bound='x') }}
    tests:
      - script:
          - xrdcp --version
      - package_contents:
          strict: true
          bin:
            exists:
              # key tools by name, plus everything else for strict coverage
              - xrootd
              - cmsd
              - xrdcp
              - xrdfs
              - "*"
            not_exists:
              # belongs to libxrootd-devel
              - xrootd-config
          files:
            - share/man/man*/*
            - share/xrootd/utils/*
    about:
      summary: XRootD command line tools and server binaries

  - package:
      name: xrootd
    inherit: xrootd-build
    build:
      script:
        file: install_python.sh
      files:
        # only ship the Python bindings; bin/ and share/ belong to xrootd-cli
        - lib/python*/site-packages/**
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - setuptools
            - pip
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - cmake
        - make
      host:
        - python
        - pip
        - setuptools
        - ${{ pin_subpackage('libxrootd-devel', exact=True) }}
      run:
        - python
        - ${{ pin_subpackage('libxrootd', upper_bound='x') }}
        - ${{ pin_subpackage('xrootd-cli', exact=True) }}
      run_exports:
        # Downstream recipes that host-depend on "xrootd" keep getting a
        # correct pin on the shared libraries.
        - ${{ pin_subpackage('libxrootd', upper_bound='x') }}
    tests:
      - python:
          imports:
            - XRootD.client
            - pyxrootd
      - package_contents:
          strict: true
          site_packages:
            - XRootD.client
            - pyxrootd
          files:
            # strict coverage for compiled extension, __pycache__, dist-info, ...
            - lib/python*/site-packages/XRootD/**
            - lib/python*/site-packages/pyxrootd/**
            - lib/python*/site-packages/xrootd-*.dist-info/**
    about:
      summary: Python bindings for XRootD

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: High performance, scalable fault tolerant access to data
  description: |
    The XROOTD project aims at giving high performance, scalable fault tolerant
    access to data repositories of many kinds. The typical usage is to give
    access to file-based ones. It is based on a scalable architecture, a
    communication protocol, and a set of plugins and tools based on those. The
    freedom to configure it and to make it scale (for size and performance)
    allows the deployment of data access clusters of virtually any size, which
    can include sophisticated features, like authentication/authorization,
    integrations with other systems, WAN data distribution, etc.
  homepage: http://xrootd.org/
  repository: https://github.com/xrootd/xrootd

extra:
  feedstock-name: xrootd
  recipe-maintainers:
    - chrisburr
